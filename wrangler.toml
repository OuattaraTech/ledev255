name = "ouattaratech"
compatibility_date = "2024-11-06"
pages_build_output_dir = "dist"

# Compteur de visiteurs : stockage KV lié sous le nom VIEWS.
# Le même namespace sert en production et sur les déploiements de test.
# L'identifiant n'est pas un secret : il ne donne accès à rien sans
# les droits du compte Cloudflare.

[[env.production.kv_namespaces]]
binding = "VIEWS"
id = "59dd26db608b468bbdfeac9bbad8ebf4"

[[env.preview.kv_namespaces]]
binding = "VIEWS"
id = "59dd26db608b468bbdfeac9bbad8ebf4"
